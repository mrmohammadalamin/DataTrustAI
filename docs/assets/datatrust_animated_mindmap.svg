<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="50%" stop-color="#0d162c" />
      <stop offset="100%" stop-color="#070c18" />
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
    <style>
      @keyframes streamDash {
        to { stroke-dashoffset: -48; }
      }
      @keyframes pulseRing {
        0%, 100% { r: 135px; stroke-opacity: 0.45; }
        50% { r: 155px; stroke-opacity: 0.15; }
      }
      .flow-line {
        stroke-dasharray: 10 6;
        animation: streamDash 1.5s linear infinite;
      }
      .pulse-circle {
        animation: pulseRing 3s ease-in-out infinite;
      }
      .title { font-family: 'Segoe UI', Inter, system-ui, sans-serif; font-weight: 700; fill: #ffffff; }
      .sub { font-family: 'Segoe UI', Inter, system-ui, sans-serif; fill: #94a3b8; }
      .mono { font-family: Consolas, 'Courier New', monospace; font-weight: 600; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" rx="18" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Top Title Banner -->
  <rect x="24" y="18" width="1152" height="54" rx="12" fill="#0f172a" stroke="#1e3a8a" stroke-width="1.5" />
  <circle cx="50" cy="45" r="8" fill="#3b82f6" />
