  <circle cx="600" cy="365" r="230" fill="none" stroke="#1e293b" stroke-dasharray="5 5" />

  <!-- Animated Mindmap Connectors -->
  <!-- Left Top: Data Estate -->
  <path d="M 600 365 C 410 365, 410 155, 215 155" fill="none" stroke="#06b6d4" stroke-opacity="0.22" stroke-width="6" />
  <path d="M 600 365 C 410 365, 410 155, 215 155" fill="none" stroke="#06b6d4" stroke-width="2.5" class="flow-line" />

  <!-- Left Middle: Security & IAP -->
  <path d="M 600 365 C 410 365, 410 365, 215 365" fill="none" stroke="#10b981" stroke-opacity="0.22" stroke-width="6" />
  <path d="M 600 365 C 410 365, 410 365, 215 365" fill="none" stroke="#10b981" stroke-width="2.5" class="flow-line" />

  <!-- Left Bottom: Deployment & Partner GTM -->
