  <path d="M 600 365 C 790 365, 790 155, 985 155" fill="none" stroke="#f59e0b" stroke-opacity="0.22" stroke-width="6" />
  <path d="M 600 365 C 790 365, 790 155, 985 155" fill="none" stroke="#f59e0b" stroke-width="2.5" class="flow-line" />

